function reschedModal(taskId){
  const o = getTask(taskId); if (!o) return;
  const s = schedById(o.scheduleId);
  const rec = s ? s.recurrence : { type:'once' };
  openModal(`<h3>Reschedule task</h3>
    <p class="msub">Move this occurrence to a new date and time.</p>
    <form id="f-resched">
      <label class="field"><span>New date & time *</span><input type="datetime-local" name="dt" required value="${dtLocal(new Date(o.dueAt))}"></label>
      ${rec.type !== 'once' ? `<label class="check"><input type="checkbox" name="shift"> Also shift future reminders from this new time</label>` : ''}
      <div class="form-err" id="r-err"></div>
      <div class="form-actions"><button type="button" class="btn ghost" data-close>Cancel</button>
      <button class="btn primary" type="submit"><i data-lucide="check"></i> Reschedule</button></div>
    </form>`);
  $('#modal-root').querySelector('[data-close]').addEventListener('click', closeModal);
  $('#f-resched').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const dt = parseLocal(String(fd.get('dt')));
    if (isNaN(dt.getTime())){ $('#r-err').textContent = 'Please pick a valid date and time.'; $('#r-err').style.display = 'block'; return; }
    const occ = ensureMaterial(taskId);
    occ.dueAt = dt.toISOString();
    occ.snoozedUntil = null; occ.snoozeAlerted = false; occ.notifiedAt = null;
    if (fd.get('shift') && s && rec.type !== 'once'){
      const nxt = REC.next(occ.dueAt, rec);
      if (nxt){ s.nextDueAt = nxt; s.status = 'active'; }
    }
    save(); closeModal(); toast(`Moved to ${dueLabel(occ.dueAt)}`, 'ok'); render();
  });
}

function softRender(){ // re-render while preserving focus in filter inputs

  const keep = ae && ['INPUT','SELECT','TEXTAREA'].includes(ae.tagName) && ae.dataset.filter !== undefined
    ? { filter: ae.dataset.filter, pos: ae.selectionStart } : null;
  render();
  if (keep){
    const el = document.querySelector(`[data-filter="${keep.filter}"]`);
    if (el){ el.focus(); if (el.setSelectionRange && keep.pos != null){ try { el.setSelectionRange(keep.pos, keep.pos); } catch(e){} } }
  }

/* ---------------- actions ---------------- */
function deletePlant(id){
  const p = plantById(id); if (!p) return;
  confirmDialog({
    title:`Delete ${p.name}?`,
    body:'This removes the plant, its reminder schedules, pending tasks and care history. You can undo for a few seconds after deleting.',
    ok:'Delete plant',
    onOK(){
      const snap = { plant:p,
        schedules:db.schedules.filter(s => s.plantId === id),
        occurrences:db.occurrences.filter(o => o.plantId === id),
        history:db.history.filter(h => h.plantId === id) };
      db.plants = db.plants.filter(x => x.id !== id);
      db.schedules = db.schedules.filter(s => s.plantId !== id);
      db.occurrences = db.occurrences.filter(o => o.plantId !== id);
      db.history = db.history.filter(h => h.plantId !== id);
      save(); render();
      toast(`${esc(p.name)} deleted`, 'warn', { action:{ label:'Undo', act(){
        db.plants.push(snap.plant); db.schedules.push(...snap.schedules);
        db.occurrences.push(...snap.occurrences); db.history.push(...snap.history);
        save(); render(); toast(`${esc(p.name)} restored`, 'ok');
      }}});
    }
  });
}
function deleteSchedule(id){
  const s = schedById(id); if (!s) return;
  const p = plantById(s.plantId);
  confirmDialog({
    title:'Delete this reminder?',
    body:`The “${(ACTIVITIES[s.activity]||ACTIVITIES.custom).label}” schedule for ${esc(p ? p.name : 'this plant')} and its pending tasks will be removed. Completed history is kept.`,
    ok:'Delete reminder',
    onOK(){
      db.schedules = db.schedules.filter(x => x.id !== id);
      db.occurrences = db.occurrences.filter(o => !(o.scheduleId === id && o.status !== 'completed'));
      save(); closeModal(); render(); toast('Reminder deleted', 'warn');
    }
  });
}
function exportData(){
  const blob = new Blob([JSON.stringify(db, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `plantcare-backup-${dayKey(new Date())}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('Backup exported', 'ok');
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || data.v !== 1 || !Array.isArray(data.plants) || !Array.isArray(data.schedules)) throw 0;
      confirmDialog({ title:'Import backup?', body:'This replaces all current data with the backup file.', ok:'Import', danger:false,
        onOK(){ db = data; save(); toast('Backup imported', 'ok'); render(); } });
    } catch(e){ toast('That file is not a valid PlantCare backup.', 'warn'); }
  };
  r.readAsText(file);
}
function runSelfTests(){
  const t = [];
  const eq = (a, b, m) => t.push({ ok: JSON.stringify(a) === JSON.stringify(b), m });
  const mk = (y, mo, d, h = 8, mi = 0) => new Date(y, mo-1, d, h, mi).toISOString();
  eq(REC.next(mk(2023,1,31), {type:'monthly',interval:1}),  mk(2023,2,28),  'Jan 31 + 1 month → Feb 28 (clamped)');
  eq(REC.next(mk(2024,1,31), {type:'monthly',interval:1}),  mk(2024,2,29),  'Jan 31 + 1 month → Feb 29 (leap year)');
  eq(REC.next(mk(2024,8,31), {type:'monthly',interval:1}),  mk(2024,9,30),  'Aug 31 + 1 month → Sep 30 (clamped)');
  eq(REC.next(mk(2024,2,29), {type:'monthly',interval:12}), mk(2025,2,28),  'Feb 29 + 12 months → Feb 28');
  eq(REC.next(mk(2024,1,15,9,30), {type:'monthly',interval:2}), mk(2024,3,15,9,30), '+2 months keeps time of day');
  eq(REC.next(mk(2024,3,1), {type:'daily',interval:1}),  mk(2024,3,2),  'daily +1 day');
  eq(REC.next(mk(2024,3,1), {type:'days',interval:10}),  mk(2024,3,11), 'custom +10 days');
  eq(REC.next(mk(2024,3,1), {type:'weekly',interval:2}), mk(2024,3,15), 'every 2 weeks');
  eq(REC.next(mk(2024,3,1), {type:'once'}), null, 'one-time returns null');
  // dedup via stable occurrence key
  const ts = { id:'t-dedup', plantId:'x', activity:'water', description:'', recurrence:{type:'daily',interval:1} };
  const a = materialize(ts, mk(2024,3,1)), b = materialize(ts, mk(2024,3,1));
  eq(a.id === b.id, true, 'same scheduled moment → one occurrence (no duplicate notification)');
  db.occurrences = db.occurrences.filter(o => o.scheduleId !== 't-dedup'); save();
  // status classification
  eq(statusOf({status:'pending', dueAt:new Date(Date.now()-36e5).toISOString(), scheduleId:'nope'}), 'overdue', 'missed task flagged overdue');
  eq(statusOf({status:'pending', dueAt:new Date(Date.now()+36e5).toISOString(), scheduleId:'nope'}), 'pending', 'future task stays pending');
  eq(statusOf({status:'completed', dueAt:new Date(Date.now()-36e5).toISOString()}), 'completed', 'completed stays completed');
  const pass = t.filter(x => x.ok).length;
  openModal(`<h3>Self-tests</h3><p class="msub">${pass}/${t.length} passed${pass === t.length ? ' — all green' : ''}. Restart recovery is covered by design: schedules persist <code>next_due_at</code>, and the sync pass materializes anything missed while the app was closed.</p>
    ${t.map(x => `<div class="test-row ${x.ok ? 'ok' : 'bad'}"><span class="mark">${x.ok ? '✓' : '✗'}</span><span>${esc(x.m)}</span></div>`).join('')}
    <div class="form-actions" style="margin-top:14px"><button class="btn ghost" data-close>Close</button></div>`);
  $('#modal-root').querySelector('[data-close]').addEventListener('click', closeModal);
}

/* ---------------- global event delegation ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  // close bell panel when clicking outside it
  if (!e.target.closest('#bell-zone')) $('#bell-panel').classList.remove('open');
  if (!t) return;
  const id = t.dataset.id;
  switch (t.dataset.act){
    case 'theme-toggle': {
      db.profile.theme = db.profile.theme === 'dark' ? 'light' : 'dark';
      applyTheme(); save(); break;
    }
    case 'bell-toggle': {
      const pn = $('#bell-panel');
      if (pn.classList.contains('open')) pn.classList.remove('open');
      else { renderBellPanel(); pn.classList.add('open'); }
      break;
    }
    case 'bell-close': $('#bell-panel').classList.remove('open'); break;
    case 'notif-enable': NOTIFY.request(); break;
    case 'dismiss-hint': db.profile.hintDismissed = true; save(); render(); break;
    case 'add-plant': plantForm(null); break;
    case 'edit-plant': plantForm(plantById(id)); break;
    case 'open-plant': plantDetail(id); break;
    case 'del-plant': deletePlant(id); break;
    case 'add-schedule': scheduleForm({ plantId: t.dataset.plant || null }); break;
    case 'edit-schedule': { const s = schedById(id); if (s) scheduleForm({ schedule:s }); break; }
    case 'del-schedule': deleteSchedule(id); break;
    case 'toggle-schedule': {
      const s = schedById(id); if (!s) break;
      if (s.status === 'active'){ s.status = 'paused'; toast('Reminder paused', 'info'); }
      else if (s.status === 'paused'){ s.status = 'active'; toast('Reminder resumed — anything missed while paused is now due', 'info'); }
      save(); render(); break;
    }
    case 'task': taskModal(id); break;
    case 'done': completeTask(id); break;
    case 'snooze': snoozeTask(id, parseInt(t.dataset.ms, 10) || 18e5); break;
    case 'resched': closeModal(); reschedModal(id); break;
    case 'pick-day': state.daySel = t.dataset.date; render(); break;
    case 'goto': {
      if (t.dataset.preset === 'overdue'){ state.filters.status = 'overdue'; state.tasksTab = 'tasks'; }
      location.hash = t.dataset.hash; break;
    }
    case 'tab': state.tasksTab = t.dataset.tab; render(); break;
    case 'cat-filter': state.filters.cat = t.dataset.cat; render(); break;
    case 'cal-prev': case 'cal-next': {
      const n = t.dataset.act === 'cal-next' ? 1 : -1;
      const c = state.calCursor;
      if (state.calView === 'month') state.calCursor = new Date(c.getFullYear(), c.getMonth() + n, 1);
      else if (state.calView === 'week') state.calCursor = addDays(c, 7*n);
      else state.calCursor = addDays(c, n);
      render(); break;
    }
    case 'cal-today': state.calCursor = new Date(); render(); break;
    case 'cal-view': state.calView = t.dataset.view; render(); break;
    case 'cal-pick': { if (state.calView !== 'day' && e.target.closest('.cell')){ state.calView = 'day'; state.calCursor = new Date(t.dataset.date + 'T00:00'); render(); } break; }
    case 'save-profile': {
      db.profile.name = String($('#set-name').value).trim() || 'friend';
      db.profile.snoozeDefault = parseInt($('#set-snooze').value, 10) || 30;
      save(); toast('Profile saved', 'ok'); render(); break;
    }
    case 'export': exportData(); break;
    case 'import-btn': $('#import-file').click(); break;
    case 'reset-data':
      confirmDialog({ title:'Reset everything?', body:'All plants, schedules and history in this browser are replaced with the demo data.', ok:'Reset',
        onOK(){ localStorage.removeItem(DB_KEY); load(); sync(); applyTheme(); render(); toast('Fresh demo data planted', 'ok'); } });
      break;
    case 'run-tests': runSelfTests(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'import-file' && el.files[0]){ importData(el.files[0]); el.value = ''; return; }
  if (el.id === 'set-notify'){ db.profile.notifyEnabled = el.checked; save(); toast(el.checked ? 'Browser notifications on' : 'Browser notifications muted — in-app alerts continue', 'info'); return; }
  if (el.dataset.filter){

});
